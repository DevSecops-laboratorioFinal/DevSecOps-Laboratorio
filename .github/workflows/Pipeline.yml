name: Pipeline CI/CD

on:
  push:
    branches:
      - feature-1

# Variables de Entorno
env:
  REPO_NAME: DevSecOps-Laboratorio-Final
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  ORGANIZACION: devsecops-laboratoriofinal
  SONAR_URL: https://sonarcloud.io
  NPM_AUDIT_REPORT: ./reports/npm_audit_report.json
  SNYK_REPORT: ./reports/snyk_report.json

jobs:
  SAST:
    runs-on: ubuntu-24.04

    steps:
      # 0. Checkout: Obtenemos el código fuente
      - name: Checkout Code
        uses: actions/checkout@v3

      # 1. Set Environment Variables: Define la rama como variable de entorno
      - name: Set Environment Variables
        run: echo "BRANCH_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      # 2. Setup Java 17: Configura Java 17 para evitar errores de versión
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Setup Node.js: Configura Node.js con la versión 17
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 17

      # 4. Check and Create Project on SonarCloud: Verifica y crea proyecto en SonarCloud si no existe
      - name: Check and Create Project on SonarCloud
        run: |
          echo "Buscando proyecto en SonarCloud..."
          RESPONSE=$(curl -s -u "${{ secrets.SONAR_TOKEN }}:" "$SONAR_URL/api/projects/search?projects=$REPO_NAME&organization=$ORGANIZACION")
          EXISTING_PROJECT=$(echo "$RESPONSE" | jq '.paging.total')
          if [ "$EXISTING_PROJECT" == "1" ]; then
            echo "El proyecto ya existe"
          else
            echo "Creando proyecto en SonarCloud..."
            CREATE_RESPONSE=$(curl -s -X POST -u "${{ secrets.SONAR_TOKEN }}:" "$SONAR_URL/api/projects/create" -d "name=$REPO_NAME" -d "project=$REPO_NAME" -d "organization=$ORGANIZACION" -d "visibility=public")
            if echo "$CREATE_RESPONSE" | jq -e '.errors' > /dev/null; then
              echo "Error al crear proyecto en SonarCloud"
              exit 1
            else
              echo "Proyecto creado exitosamente"
            fi
          fi

      # 5. Install SonarScanner: Instala SonarScanner como dependencia de desarrollo
      - name: Install SonarScanner
        run: npm install sonar-scanner --save-dev

      # 6. Perform Initial Analysis on Main: Realiza el primer análisis en la rama master
      - name: Perform Initial Analysis on Main
        run: |
          ./node_modules/.bin/sonar-scanner \
            -Dsonar.projectKey=$REPO_NAME \
            -Dsonar.organization=$ORGANIZACION \
            -Dsonar.host.url=$SONAR_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.branch.name=master

      # 7. Validate Quality Gate: Valida el estado del Quality Gate en SonarCloud
      - name: Validate Quality Gate
        run: |
          analysisId=$(curl -s -u "$SONAR_TOKEN:" "$SONAR_URL/api/ce/component?component=$REPO_NAME" | jq -r '.current.analysisId')
          qualityGateStatus=$(curl -s -u "$SONAR_TOKEN:" "$SONAR_URL/api/qualitygates/project_status?analysisId=$analysisId" | jq -r '.projectStatus.status')
          if [ "$qualityGateStatus" != "OK" ]; then
            echo "El proyecto no cumple con el Quality Gate: $qualityGateStatus"
            vulnerabilities=$(curl -s -u "$SONAR_TOKEN:" "$SONAR_URL/api/issues/search?componentKeys=$REPO_NAME&types=VULNERABILITY&severities=CRITICAL,BLOCKER" | jq -r '.total')
            if [ "$vulnerabilities" -gt 0 ]; then
              echo "Se encontraron $vulnerabilities vulnerabilidades críticas. Deteniendo pipeline."
              exit 1
            fi
          else
            echo "El proyecto cumple con el Quality Gate."

  SCA:
    runs-on: ubuntu-24.04

    env:
      VULNERABILIDADES: false  # Inicializa la variable de estado

    steps:
      # 0. Checkout: Obtenemos el código fuente
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. Set up Node.js: Configura Node.js con la versión 20
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 2. Check Node.js version: Verifica la versión de Node.js instalada
      - name: Check Node.js version
        run: node -v

      # 3. Install dependencies: Instala las dependencias del proyecto
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 4. Create reports directory: Crea un directorio para los reportes
      - name: Create reports directory
        run: mkdir -p ./reports

      # 5. Dependency Check: Ejecuta un chequeo de dependencias usando Snyk
      - name: Dependency Check
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high --json-file-output=$SNYK_REPORT

      # 6. Run npm audit: Realiza un npm audit y guarda el reporte
      - name: Run npm audit
        run: |
          npm audit --json > $NPM_AUDIT_REPORT || true
          if [ $? -ne 0 ]; then
            echo "VULNERABILIDADES=true" >> $GITHUB_ENV

      # 7. Upload Snyk Report: Sube el reporte de Snyk como artefacto
      - name: Upload Snyk Report
        uses: actions/upload-artifact@v4
        with:
          name: Snyk Report
          path: $SNYK_REPORT

      # 8. Upload npm Audit Report: Sube el reporte de npm audit como artefacto
      - name: Upload npm Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: npm Audit Report
          path: $NPM_AUDIT_REPORT

      # 9. Check for high severity vulnerabilities: Verifica si hay vulnerabilidades de alta severidad
      - name: Check for high severity vulnerabilities
        run: |
          if grep -q '"severity": "high"' $SNYK_REPORT; then
            echo "VULNERABILIDADES=true" >> $GITHUB_ENV

      # 10. Fail if there are vulnerabilities: Detiene el pipeline si se detectan vulnerabilidades de alta severidad
      - name: Fail if there are vulnerabilities
        run: |
          if [ "$VULNERABILIDADES" = "true" ]; then
            echo "Vulnerabilidades Detectadas. Detiene proceso de pipeline."
            exit 1
