  IMAGE-ANALISIS-DOCKER:
    runs-on: ubuntu-latest
    #needs: SCA

    steps:
    # 0. Checkout: Obtenemos el código fuente.
    - name: Checkout Código
      uses: actions/checkout@v3

    # Paso 1: Configurar Docker Buildx para la construcción de imágenes
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    # Paso 2: Login en Docker Hub
    - name: Iniciar Sesion en Docker Hub
      id: iniciar_sesion
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Paso 3: Verificar si la imagen ya existe, detiene la ejecucion y elimina el contenedor luego crea una nueva.
    - name: Verificar y manejar imagen existente
      # Detener y eliminar el contenedor si existe
      run: | 
        if [ "$(docker ps -q -f name=${{ env.NOMBRE_IMAGEN }})" ]; then
          echo "Deteniendo contenedor existente: ${{ env.NOMBRE_IMAGEN }}"
          docker stop ${{ env.NOMBRE_IMAGEN }}
          echo "Eliminando contenedor existente: ${{ env.NOMBRE_IMAGEN }}"
          docker rm ${{ env.NOMBRE_IMAGEN }}
        fi

        # Eliminar la imagen si existe
        if docker images ${{ env.NOMBRE_IMAGEN }} | grep -q ${{ env.NOMBRE_IMAGEN }}; then
          echo "Eliminando imagen existente: ${{ env.NOMBRE_IMAGEN }}"
          docker rmi ${{ env.NOMBRE_IMAGEN }}
        fi

        # Construir la nueva imagen Docker
        echo "Construyendo nueva imagen Docker"
        docker build -t ${{ env.NOMBRE_IMAGEN }} .
    
    # Paso 6: Listar todas las imágenes Docker existentes y obtener el ID de la nueva imagen
    - name: Listar Docker images y obtener ID de imagen
      run: |
        docker images
        IMAGE_ID=$(docker images ${{ env.NOMBRE_IMAGEN }} --format "{{.ID}}")
        echo "IMAGE_ID=$IMAGE_ID" >> $GITHUB_ENV
    # Paso 7
    - name: Ejecutar imagen en entorno para pruebas
      run: echo "$IMAGE_ID"
      #docker run --name devsecops-container -p 3000: 3000 47188064f443